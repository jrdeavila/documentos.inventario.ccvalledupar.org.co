[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true


[program:ssh-tunnel]
command=/bin/bash /var/www/html/docker/tunnel.sh
user=root
autostart=true
autorestart=true
stderr_logfile=/var/log/tunnel.err.log
stdout_logfile=/var/log/tunnel.out.log
priority=1